name: Build iOS framework

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-tests:
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Verify packaging and rejection paths
        shell: pwsh
        run: ./tests/package-smoke.ps1
  build:
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Show Apple toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
      - name: Build arm64 framework
        run: bash build-macos.sh
      - name: Build read-only device diagnostic variant
        run: GLOW_DEV_BRIDGE=1 BUILD_DIR=build/dev bash build-macos.sh
      - name: Check menu in iOS Simulator (legacy lifecycle)
        run: bash tests/ui-smoke.sh
      - name: Validate Mach-O and framework
        run: |
          plutil -lint build/GlowESP.framework/Info.plist
          xcrun lipo build/GlowESP.framework/GlowESP -verify_arch arm64
          xcrun otool -hv build/GlowESP.framework/GlowESP
          xcrun otool -L build/GlowESP.framework/GlowESP
          codesign --force --sign - build/GlowESP.framework
          codesign --verify --strict --verbose=2 build/GlowESP.framework
          codesign --force --sign - build/dev/GlowESP.framework
          codesign --verify --strict --verbose=2 build/dev/GlowESP.framework
      - name: Package artifact
        run: |
          ditto -c -k --keepParent build/GlowESP.framework build/GlowESP.framework.zip
          ditto -c -k --keepParent build/dev/GlowESP.framework build/GlowESP.dev.framework.zip
          shasum -a 256 build/GlowESP.framework.zip > build/SHA256SUMS.txt
          printf '%s\n' 'Ad hoc signed framework. Re-sign with the containing app before installation.' > build/ARTIFACT-NOTES.txt
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: GlowESP-arm64-${{ github.sha }}
          path: |
            build/GlowESP.framework.zip
            build/GlowESP.dev.framework.zip
            build/SHA256SUMS.txt
            build/ARTIFACT-NOTES.txt
            build/ui-smoke.txt
          if-no-files-found: error
          retention-days: 14

